<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TASK-018 Case Reconciliation Preview</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2f;--line:#2b385d;--text:#edf2ff;--muted:#9eacd0;--warn:#ffd166;--bad:#ff6b7a;--ok:#64d8a5}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui;padding:24px}
    main{max-width:1100px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
    h1,h2{margin:0 0 10px}.muted{color:var(--muted)}button{background:#182442;color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:9px;margin:3px}
    button[aria-pressed=true]{border-color:#70a7ff;background:#203764}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#273557;margin-right:6px}
    .warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px}
    code{word-break:break-all}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <p class="muted">STATIC · SYNTHETIC UI CONTRACT · NETWORK 0</p>
  <h1>Case Reconciliation</h1>
  <section class="panel">
    <h2>Category</h2>
    <div id="categories" role="group" aria-label="Case category">
      <button aria-pressed="false">Phishing</button><button aria-pressed="false">Address poisoning</button>
      <button aria-pressed="true">Exploit</button><button aria-pressed="false">Rug pull</button><button aria-pressed="false">Mixed</button>
    </div>
    <h2>Result state</h2>
    <div id="states" role="group" aria-label="Result state">
      <button aria-pressed="true" data-state="partial">Partial</button>
      <button aria-pressed="false" data-state="failed">Failed</button>
      <button aria-pressed="false" data-state="unsupported">Unsupported</button>
    </div>
  </section>
  <section class="panel" id="content" aria-live="polite"></section>
</main>
<script>
const content=document.querySelector("#content");
const views={
partial:`<h2 class="warn">PARTIAL · selected exit path only</h2><p><span class="badge">3 ordered hops</span><span class="badge">4 remerge branches</span></p>
<table><tr><th>#</th><th>Fact</th><th>Evidence</th></tr><tr><td>1</td><td>Seed internal ETH transfer</td><td>confirmed FLOW path</td></tr><tr><td>2</td><td>Selected terminal reached</td><td>confirmed FLOW path</td></tr><tr><td>3</td><td>Unrelated inflow excluded</td><td>confirmed REMERGE ledger</td></tr></table>
<div class="grid"><div><h2>External context</h2><p>Euler official chronology · context only</p></div><div><h2>Assessment boundary</h2><p>Ownership: <b>not_assessed</b><br>Exploit causation: <b>not_assessed</b><br>Criminal intent: <b>not_assessed</b></p></div></div>
<p class="warn">Next: full seed discovery and continuous all-funds scan. No submission-ready claim.</p>`,
failed:`<h2 class="bad">FAILED · reconciliation conflict</h2><p>Source fixture hash, seed transaction, or acquired edge endpoints differ.</p><p><code>reconciliation_failed / source_reconciliation</code></p>`,
unsupported:`<h2>UNSUPPORTED · reviewed fixture unavailable</h2><p>The selected category has no approved raw replay. AI may propose a method, but no fact is emitted until Python replay and an independent verifier succeed.</p>`
};
function activate(group,button){group.querySelectorAll("button").forEach(b=>{b.setAttribute("aria-pressed",String(b===button));b.tabIndex=b===button?0:-1});button.focus()}
document.querySelectorAll("[role=group]").forEach(group=>{const buttons=[...group.querySelectorAll("button")];buttons.forEach((button,index)=>{button.tabIndex=button.getAttribute("aria-pressed")==="true"?0:-1;button.addEventListener("click",()=>{activate(group,button);if(button.dataset.state)content.innerHTML=views[button.dataset.state]});button.addEventListener("keydown",event=>{let next;if(event.key==="ArrowRight")next=(index+1)%buttons.length;if(event.key==="ArrowLeft")next=(index-1+buttons.length)%buttons.length;if(event.key==="Home")next=0;if(event.key==="End")next=buttons.length-1;if(next!==undefined){event.preventDefault();buttons[next].click()}})})});
content.innerHTML=views.partial;
</script>
</body>
</html>
